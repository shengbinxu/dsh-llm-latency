# dsh-llm-latency — apply after dsh-base so the `llm` service is present.
# The row loads this package's own host plugin (lib/index.js) into the runtime.
- insert:
    - id: llm-latency
      name: dsh-llm-latency
      config:
        # Number of distinct real-request snapshots retained for benchmarking.
        snapshotLimit: 8
        # Maximum JSON byte size of one retained snapshot; larger requests are
        # still measured but are skipped for replay benchmarking.
        snapshotMaxBytes: 4000000
        # Default benchmark rounds per target route.
        benchmarkRounds: 3
        # When true, the benchmark injects a random system-prompt prefix to defeat
        # prefix caching and measure cold compute only. Off by default so the
        # comparison reflects real interactive use.
        cacheBust: false
