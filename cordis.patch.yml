# dsh-llm-latency — apply after dsh-base so the `llm` service is present.
# The row loads this package's own host plugin (lib/index.js) into the runtime.
- insert:
    - id: llm-latency
      name: dsh-llm-latency
      config:
        # Data retention window in days; older hour buckets and sessions are pruned.
        retentionDays: 30
        # Per-key exact-sample ring cap.
        recentLimit: 2000
        # Number of sessions retained (most recent first).
        sessionLimit: 500
        # TTFT above this many ms counts as a spike.
        spikeFloorMs: 10000
        # Canonical model name -> provider model ids, for same-model cross-vendor grouping.
        # Example:
        #   modelAliases:
        #     deepseek-v4: ["deepseek-v4-pro", "deepseek-v4-flash", "bailian-deepseek-v4"]
        modelAliases: {}
        # Minimum ok samples before a median confidence interval is reported.
        minSamplesForComparison: 20
        # Request-log mirror cap (recent records kept for search/filter).
        logLimit: 5000
        # Request-log retention window in days.
        logRetentionDays: 7
